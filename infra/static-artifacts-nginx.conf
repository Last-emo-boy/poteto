pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    map $host $poteto_release {
        default "";
        "~^preview-(?<poteto_release_id>[a-f0-9]{24})\.[a-z0-9.-]+$" $poteto_release_id;
    }
    server {
        listen 8080 default_server;
        if ($poteto_release = "") { return 404; }
        root /srv/releases/$poteto_release;
        if (!-f $document_root/index.html) { return 404; }
        add_header X-Paas-Deployment $poteto_release always;
        add_header X-Content-Type-Options nosniff always;
        location = /__paas_route_probe__ { return 204; }
        location ~ (^|/)\. { return 404; }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
