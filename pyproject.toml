[project]
name = "ovh-paas-publisher"
version = "0.14.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.3",
    "pyjwt>=2.10.1,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["publisher"]

[project.scripts]
poteto = "publisher.cli:main"
paas = "publisher.cli:legacy_main"
paas-admin = "publisher.admin:main"

[tool.setuptools.package-data]
publisher = ["*.conf"]
