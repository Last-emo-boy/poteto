name: CLI portability
on:
  push:
    paths:
      - 'publisher/**'
      - 'execution/**'
      - 'infra/execution/**'
      - 'scripts/build-poteto-dist'
      - 'scripts/install-poteto.*'
      - 'tests/**'
      - 'skills/**'
      - 'pyproject.toml'
      - '.github/workflows/cli.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . httpx==0.28.1
      - name: Platform and CLI regression tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests/publisher
      - name: Real Linux prebuilt image intake
        if: runner.os == 'Linux'
        run: sh tests/linux/test-prebuilt-image.sh
      - name: Real local Node build and runtime
        if: runner.os == 'Linux'
        run: sh tests/linux/test-local-node.sh
      - name: Windows project and browser callback tests
        if: runner.os == 'Windows'
        run: |
          $env:PYTHONPATH = "tests/publisher"
          python -m unittest test_cli_project.LocalLinkTests test_cli_portable test_cli_presets test_cli_prebuilt test_cli_local_build test_cli_upload test_cli_usage
      - name: Build the standalone distribution
        run: python scripts/build-poteto-dist dist --url https://poteto.iflink.tech --api-url https://deploy.iflink.tech
      - name: Windows PowerShell installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/test-installer.ps1 -Dist ./dist
